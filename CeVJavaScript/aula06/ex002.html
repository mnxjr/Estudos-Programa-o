<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu pimeiro progama...</title>
    <style>
        body {
            background-color: rgb(0, 110, 255);
            color: white;
            font: normal 20pt Arial;
        }
        h1 {
            color: tomato;
        }
    </style>
</head>
<body>
    <h1>Olá, mundo!</h1>
    <p>Já me livrei da maldição!!</p>
    <script>
        alert('Minha primeira mensagem!') // exibe uma janela com somente uma opção: 'Ok'.
        confirm('Está gostando de JavaScript?') // exibe uma janela com duas opções: 'Ok' e 'Cancelar'.
        var nome = window.prompt('Qual é seu nome') // exibe uma janela com uma entrada de texto(espaço para o usuário escrever).
        alert('É um grande prazer em te conhecer,'+ nome + '!') // Concatenação
    </script>
</body> 
</html>
