<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula09</title>
    <style>
        body {
            background: green;
            color: white;
            font: normal 18pt Arial
        }
    </style>
</head>
<body>
    <h1>Iniciando estudos com DOM</h1>
    <p>Aqui vai o resultado</p>
    <p>Aprendendo a usar o <strong>DOM</strong> em JavaScript.</p>
    <div id="msg">clique em mim</div>
    <script>
        var corpo = document.body
        corpo.style.background = "#5aa777a4"
        
        /* var p1 = window.document.getElementsByTagName('p')[1]*/ /*   pegando por elemento   */
        // var d = document.getElementById('msg') // --- pegando por id
        // d.style.background = 'green' \\
        var d = window.document.querySelector('div#msg')//Pegando através do seletor(id = #)(class = .)
        d.style.background = 'blue'
    </script>
</body>
</html>
